<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="referrer" content="no-referrer">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/icon.png' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="34" height="34">
        <span>Untraceable</span>
      </a>
      <nav aria-label="Site">
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
      </nav>
    </div>
  </header>

  {% if page.layout_style == "landing" %}
  {{ content }}
  {% else %}
  <main class="wrap doc">
    {{ content }}
  </main>
  {% endif %}

  <footer class="foot">
    <div class="wrap foot-row">
      <span>© {{ site.time | date: "%Y" }} Untraceable. Runs only on your iPhone.</span>
      <nav aria-label="Legal">
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms of Use</a>
      </nav>
    </div>
  </footer>
</body>
</html>
